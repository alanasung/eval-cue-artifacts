[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalaware"
version = "0.1.0"
description = "Train a probe for 'this is a test', then let it referee an automated rewrite loop that makes evaluations harder to recognize."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "J Rosser" }]
dependencies = [
  "torch==2.6.0",
  "transformers==4.48.0",
  "accelerate==1.2.1",
  "datasets==3.2.0",
  "matplotlib==3.9.4",
  "numpy==1.26.4",
  "peft==0.14.0",
  "pyyaml==6.0.2",
  "scikit-learn==1.5.2",
  "tqdm==4.67.1",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "scipy==1.14.1",
  "pandas==2.2.3",
  "einops==0.8.0",
  "trl==0.14.0",
]

[project.optional-dependencies]
dev = ["ruff==0.8.4", "mypy==1.14.1", "pre-commit>=3.8"]
test = ["pytest==8.3.4", "pytest-cov==6.0.0"]
figures = ["matplotlib==3.9.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]
ignore = ["E501", "E701", "E702", "E731", "UP031", "UP038", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "N812", "I001", "F841"]
"scripts/*" = ["T201", "E701", "E702"]
"src/**/probes.py" = ["N806", "N803"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = ["slow: needs weights or a long run"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
pretty = true
